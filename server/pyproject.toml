[project]
name = "rspi-ai-server"
version = "0.1.0"
description = "Local voice-agent backend (STT/LLM/TTS) for the rspi_ai project"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "httpx>=0.27",
    "faster-whisper>=1.0",
    "numpy>=1.26",
    "soxr>=0.5",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
